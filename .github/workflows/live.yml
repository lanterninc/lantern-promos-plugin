name: live

# Kept out of the check workflow so a server outage cannot block a pull request.
on:
  schedule:
    - cron: '17 14 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check the live server still has the tools the plugin names
        run: npm run check:live
